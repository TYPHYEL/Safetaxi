name: safetaxi_cameroun
description: Application de sécurisation des taxis urbains de Yaoundé
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # HTTP & API
  dio: ^5.4.3
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1

  # Firebase
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.6
  cloud_firestore: ^4.17.3
  firebase_database: ^10.5.6
  firebase_messaging: ^14.9.3
  firebase_storage: ^11.7.5

  # Géolocalisation
  geolocator: ^11.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_map_cancellable_tile_provider: ^3.1.0
  flutter_local_notifications: ^17.2.3

  # Auth & Sécurité
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.2.0
  pin_code_fields: ^8.0.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Cache & Offline
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.3

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  fl_chart: ^0.67.0
  badges: ^3.1.2
  another_flushbar: ^1.12.30
  modal_bottom_sheet: ^3.0.0
  image_picker: ^1.1.2
  photo_view: ^0.14.0
  intl: ^0.19.0
  timeago: ^3.6.1

  # Utilitaires
  equatable: ^2.0.5
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  get_it: ^7.7.0
  injectable: ^2.4.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  package_info_plus: ^8.0.2
  flutter_svg: ^2.0.10+1
  uuid: ^4.4.0
  crypto: ^3.0.3
  logger: ^2.4.0
  http: ^1.2.0
  path_provider: ^2.1.2

  # Bluetooth
  flutter_blue_plus: ^1.32.0

  # Camera
  camera: ^0.10.5+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0
  injectable_generator: ^2.4.2
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/iconpp.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#00C896"
  adaptive_icon_foreground: "assets/icons/iconpp.jpeg"
